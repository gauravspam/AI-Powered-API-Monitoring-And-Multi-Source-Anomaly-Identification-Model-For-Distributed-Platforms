######################################################################
# Fluentd Configuration for API Monitoring Platform
# Architecture: Option B - Logs Only Path
#
# Purpose:
#   - Collect application logs from services via forward/http
#   - Ship logs to OpenSearch for storage and search
#   - Metrics and traces continue via backend API endpoints
#
# Data Flow:
#   Service Logs → Fluentd (port 24224) → OpenSearch
#   Service Metrics → Backend API (/api/metrics) → Postgres
#   Service Traces → Backend API (/api/traces/ingest) → Postgres
######################################################################

# ---------- INPUT SOURCES ----------

# Accept logs via Fluentd forward protocol (default for log shippers)
<source>
  @type forward
  @id input_forward
  port 24224
  bind 0.0.0.0
  
  # Security: Optional tag prefix for isolation
  # add_tag_prefix forwarded
  
  <transport tcp>
  </transport>
</source>

# Accept logs via HTTP (for direct POST from applications)
<source>
  @type http
  @id input_http
  port 9880
  bind 0.0.0.0
  
  # Parse incoming JSON logs
  <parse>
    @type json
    time_key timestamp
    time_format %iso8601
  </parse>
</source>

# Health check endpoint for Docker/k8s
<source>
  @type monitor_agent
  @id input_monitor_agent
  bind 0.0.0.0
  port 8888
  include_config false
</source>

# Prometheus metrics endpoint for monitoring Fluentd itself
<source>
  @type prometheus
  @id input_prometheus
  bind 0.0.0.0
  port 24231
  metrics_path /metrics
</source>

<source>
  @type prometheus_output_monitor
  @id output_prometheus_monitor
  interval 10
</source>

# ---------- FILTERS ----------

# Add common metadata to all log records
<filter **>
  @type record_modifier
  @id filter_record_modifier
  
  <record>
    # Add Fluentd processing timestamp
    fluentd_received_at ${Time.now.iso8601}
    
    # Add hostname/container info
    fluentd_hostname "#{Socket.gethostname}"
    
    # Add log source type
    source_type logs
  </record>
</filter>

# Parse JSON if the message field contains JSON
<filter **>
  @type parser
  @id filter_parser_json
  key_name message
  reserve_data true
  reserve_time true
  inject_key_prefix parsed_
  
  <parse>
    @type json
  </parse>
  
  # Don't fail if message is not JSON
  emit_invalid_record_to_error false
</filter>

# Tag-based routing for different log types (optional)
<filter app.**>
  @type record_modifier
  <record>
    log_category application
  </record>
</filter>

<filter system.**>
  @type record_modifier
  <record>
    log_category system
  </record>
</filter>

# ---------- OUTPUT TO OPENSEARCH ----------

# Primary output: Send all logs to OpenSearch
<match **>
  @type opensearch
  @id output_opensearch
  @log_level info

  # OpenSearch connection
  hosts opensearch:9200
  scheme http
  path_prefix /
  suppress_type_name true
  
  # Index configuration
  # Creates daily indices like: logs-2026.03.08
  index_name logs
  logstash_format true
  logstash_prefix logs
  logstash_dateformat %Y.%m.%d
  
  # Include tag and timestamp in index
  include_tag_key true
  tag_key @log_tag
  include_timestamp true
  
  # Buffering strategy for reliability
  <buffer tag,time>
    @type file
    path /fluentd/log/opensearch.buffer
    
    # Flush every 10 seconds or when buffer reaches 5MB
    flush_interval 10s
    flush_at_shutdown true
    
    # Time-based chunking (hourly)
    timekey 3600
    timekey_wait 60s
    timekey_use_utc true
    
    # Buffer limits
    chunk_limit_size 5M
    total_limit_size 512M
    
    # Retry configuration
    retry_type exponential_backoff
    retry_timeout 1h
    retry_max_interval 30s
    retry_forever false
    retry_wait 10s
    overflow_action block
  </buffer>
  
  # Request/response configuration
  request_timeout 15s
  reload_connections false
  reconnect_on_error true
  reload_on_failure true
  
  # Bulk insert settings
  bulk_message_request_threshold 20M
  
  # If OpenSearch is down, log to stdout as fallback
  <secondary>
    @type stdout
  </secondary>
</match>

######################################################################
# Notes:
# 
# 1. This config handles LOGS ONLY - no metrics or traces
# 2. Metrics go to: POST http://backend:8080/api/metrics
# 3. Traces go to:  POST http://backend:8080/api/traces/ingest
# 4. Services should emit logs to:
#    - Fluentd forward: fluent://fluentd:24224
#    - HTTP endpoint:   http://fluentd:9880/app.logs
# 5. Buffer files persist in /fluentd/log for crash recovery
# 6. Health check: http://fluentd:8888/api/plugins.json
# 7. Metrics: http://fluentd:24231/metrics
######################################################################

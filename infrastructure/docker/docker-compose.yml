services:
    postgres:
        image: postgres:16
        container_name: postgres
        environment:
            POSTGRES_DB: api_monitoring
            POSTGRES_USER: api_monitor
            POSTGRES_PASSWORD: api_monitor_pwd
        ports:
            - "5433:5432" # Use 5433 on host to avoid conflict
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - monitoring-net
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U api_monitor -d api_monitoring"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    opensearch:
        image: opensearchproject/opensearch:2.17.0
        container_name: opensearch
        environment:
            - cluster.name=docker-cluster
            - node.name=opensearch-node1
            - discovery.seed_hosts=opensearch
            - cluster.initial_master_nodes=opensearch-node1
            - bootstrap.memory_lock=true
            - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
            - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Admin123!
            - DISABLE_SECURITY_PLUGIN=true
        ulimits:
            memlock:
                soft: -1
                hard: -1
        volumes:
            - opensearch_data:/usr/share/opensearch/data
        ports:
            - "9200:9200"
            - "9600:9600"
        networks:
            - monitoring-net
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -s http://localhost:9200 >/dev/null || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    fluentd:
        image: fluent/fluentd-kubernetes-daemonset:v1.16-debian-opensearch-1
        build:
            context: ../../fluentd
            dockerfile: Dockerfile
        container_name: fluentd
        volumes:
            - ./fluentd/fluent.conf:/fluentd/etc/fluent.conf
            - ./fluent-plugins:/fluentd/plugins
        environment:
            FLUENT_UID: 0
        ports:
            - "9880:9880"
            - "24224:24224"
        depends_on:
            opensearch:
                condition: service_healthy
        networks:
            - monitoring-net
        restart: unless-stopped

    backend:
        build:
            context: ../../backend-service
            dockerfile: Dockerfile
        container_name: api-monitoring-backend
        environment:
            SPRING_PROFILES_ACTIVE: docker
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/api_monitoring?currentSchema=public
            SPRING_DATASOURCE_USERNAME: api_monitor
            SPRING_DATASOURCE_PASSWORD: api_monitor_pwd
            LOGGING_LEVEL_ROOT: INFO
            LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_AUTOCONFIGURE: DEBUG
            FLUENTD_HOST: fluentd
            FLUENTD_PORT: "9880"
            OPENSEARCH_ENABLED: "true"
            OPENSEARCH_HOST: opensearch
            OPENSEARCH_PORT: "9200"
            OPENSEARCH_SCHEME: http
            OPENSEARCH_USERNAME: admin
            OPENSEARCH_PASSWORD: Admin@123
            ML_SERVICE_URL: http://host.docker.internal:9000
            # SPRING_PROFILES_ACTIVE: docker
            # SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/api_monitoring?currentSchema=public
            # SPRING_DATASOURCE_USERNAME: api_monitor
            # SPRING_DATASOURCE_PASSWORD: api_monitor_pwd
            # SPRING_FLYWAY_ENABLED: "true"
            # SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
            # SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/api_monitoring?currentSchema=public
            # SPRING_FLYWAY_USER: api_monitor
            # SPRING_FLYWAY_PASSWORD: api_monitor_pwd
            # SPRING_FLYWAY_LOCATIONS: classpath:db/migration
            # SPRING_FLYWAY_SCHEMAS: public
            # LOGGING_LEVEL_ORG_FLYWAYDB: DEBUG
            # SPRING_JPA_SHOW_SQL: "true"
            # LOGGING_LEVEL_ROOT: INFO
            # FLUENTD_HOST: fluentd
            # FLUENTD_PORT: "9880"
            # OPENSEARCH_ENABLED: "true"
            # OPENSEARCH_HOST: opensearch
            # OPENSEARCH_PORT: "9200"
            # OPENSEARCH_SCHEME: http
            # OPENSEARCH_USERNAME: admin
            # OPENSEARCH_PASSWORD: Admin@123
            # ML_SERVICE_URL: http://host.docker.internal:9000
        ports:
            - "8081:8080" # Use 8081 to avoid conflict with your running backend
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            opensearch:
                condition: service_healthy
            fluentd:
                condition: service_started
        networks:
            - monitoring-net
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 120s

    frontend:
        build:
            context: ../../frontend
            dockerfile: Dockerfile
        container_name: api-monitoring-frontend
        ports:
            - "3000:80"
        environment:
            - REACT_APP_API_URL=http://localhost:8081
            - REACT_APP_OPENSEARCH_URL=http://localhost:9200
        depends_on:
            backend:
                condition: service_healthy
        networks:
            - monitoring-net
        restart: unless-stopped

networks:
    monitoring-net:

volumes:
    postgres_data:
    opensearch_data:

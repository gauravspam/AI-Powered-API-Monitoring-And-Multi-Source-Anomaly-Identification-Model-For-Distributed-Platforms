services:
  postgres:
    image: postgres:16
    container_name: postgres
    command: postgres -c listen_addresses='*'
    environment:
      POSTGRES_DB: api_monitoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=pg_stat_statements"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/01-init-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql
    ports:
      - "5432:5432"
    networks:
      - monitoring-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: opensearch
    environment:
      - cluster.name=docker-cluster
      - node.name=opensearch-node1
      - discovery.seed_hosts=opensearch
      - cluster.initial_master_nodes=opensearch-node1
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Admin123!
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - monitoring-net
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  fluentd:
    image: fluent/fluentd-kubernetes-daemonset:v1.16-debian-opensearch-1
    container_name: fluentd
    volumes:
      - ./fluentd/fluent.conf:/fluentd/etc/fluent.conf
      - ./fluent-plugins:/fluentd/plugins
    environment:
      FLUENT_UID: 0
    ports:
      - "9880:9880"
      - "24224:24224"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - monitoring-net

  backend:
    build: 
      context: ../../backend/java-apis
      dockerfile: Dockerfile
    container_name: api-monitoring-backend
    
    environment:
      SPRING_PROFILES_ACTIVE: docker

      # DataSource - for app runtime
      SPRING_DATASOURCE_URL: jdbc:postgresql://172.19.0.1:5432/api_monitoring?currentSchema=public
      SPRING_DATASOURCE_USERNAME: api_monitor
      SPRING_DATASOURCE_PASSWORD: api_monitor_pwd

      # Flyway
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_URL: jdbc:postgresql://172.19.0.1:5432/api_monitoring?currentSchema=public
      SPRING_FLYWAY_USER: api_monitor
      SPRING_FLYWAY_PASSWORD: api_monitor_pwd
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_SCHEMAS: public

      LOGGING_LEVEL_ORG_FLYWAYDB: DEBUG
      SPRING_JPA_SHOW_SQL: "true"
      LOGGING_LEVEL_ROOT: DEBUG

      FLUENTD_HOST: fluentd
      FLUENTD_PORT: "9880"
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_SCHEME: http
    ports:
      - "8080:8080"

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      fluentd:
        condition: service_started

    networks:
      - monitoring-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: api-monitoring-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
      - REACT_APP_OPENSEARCH_URL=http://localhost:9200
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - monitoring-net
    restart: unless-stopped

networks:
  monitoring-net:

volumes:
  postgres_data:
  opensearch_data:

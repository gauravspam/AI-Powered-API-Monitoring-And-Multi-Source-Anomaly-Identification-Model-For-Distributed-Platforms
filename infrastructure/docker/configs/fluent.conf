######################################################################
# Fluentd Configuration for API Monitoring Platform
# Architecture: Full Pipeline with PostgreSQL + OpenSearch
#
# Purpose:
#   - Collect logs/metrics/traces from various sources
#   - Route to appropriate destinations:
#     * Logs → OpenSearch
#     * Metrics → Backend API → PostgreSQL  
#     * Traces → Backend API → PostgreSQL
#   - ML Service queries OpenSearch for batch predictions
#
# Data Flow:
#   Service → Fluentd (forward/http) → OpenSearch + Backend → PostgreSQL
#   OpenSearch → ML Service (batch query) → Predictions → PostgreSQL
######################################################################

# ---------- INPUT SOURCES ----------

# Accept data via Fluentd forward protocol (from Fluent Bit, collectors)
<source>
  @type forward
  @id input_forward
  port 24224
  bind 0.0.0.0
  <transport tcp>
  </transport>
</source>

# Accept data via HTTP (for direct POST from applications)
<source>
  @type http
  @id input_http
  port 9880
  bind 0.0.0.0
</source>

# Health check endpoint for Docker/k8s
<source>
  @type monitor_agent
  @id input_monitor_agent
  bind 0.0.0.0
  port 8888
  include_config false
</source>

# Prometheus metrics endpoint for monitoring Fluentd itself
<source>
  @type prometheus
  @id input_prometheus
  bind 0.0.0.0
  port 24231
  metrics_path /metrics
</source>

<source>
  @type prometheus_output_monitor
  @id output_prometheus_monitor
  interval 10
</source>

# ---------- TAG ROUTING ----------

# Tag incoming data based on source type for routing
# Format expected: <modality>.<service>.<hostname>
# Examples: metrics.user-service, logs.payment-service, traces.order-service

# ---------- FILTERS ----------

# Add common metadata to all records
<filter **>
  @type record_modifier
  @id filter_record_modifier
  
  <record>
    fluentd_received_at ${Time.now.iso8601}
    fluentd_hostname "#{Socket.gethostname}"
  </record>
</filter>

# ---------- OUTPUT ROUTING ----------

# Route LOGS to OpenSearch
<match logs.**>
  @type opensearch
  @id output_opensearch_logs
  @log_level info

  hosts opensearch:9200
  scheme http
  path_prefix /
  suppress_type_name true
  
  index_name logs
  logstash_format true
  logstash_prefix logs
  logstash_dateformat %Y.%m.%d
  
  include_tag_key true
  tag_key @log_tag
  include_timestamp true
  
  <buffer tag,time>
    @type file
    path /fluentd/log/opensearch.buffer
    flush_interval 10s
    flush_at_shutdown true
    timekey 3600
    timekey_wait 60s
    timekey_use_utc true
    chunk_limit_size 5M
    total_limit_size 512M
    retry_type exponential_backoff
    retry_timeout 1h
    retry_max_interval 30s
    retry_forever false
    retry_wait 10s
    overflow_action block
  </buffer>
  
  request_timeout 15s
  reload_connections false
  reconnect_on_error true
  
  <secondary>
    @type stdout
  </secondary>
</match>

# Route METRICS to Backend API → PostgreSQL
# Note: Backend has path /api/metrics/api/metrics based on @RequestMapping("/api/metrics") + @PostMapping("/api/metrics")
<match metrics.**>
  @type http
  @id output_backend_metrics
  @log_level info
  
  endpoint http://172.18.0.1:8080/api/metrics/api/metrics
  method post
  content_type application/json
  
  # Buffer configuration
  <buffer>
    @type file
    path /fluentd/log/metrics_backend.buffer
    flush_interval 30s
    flush_at_shutdown true
    chunk_limit_size 1M
    total_limit_size 100M
  </buffer>
  
  # Retry configuration
  retry_limit 3
  retry_wait 10s
  
  # Fallback: log to stdout if backend fails
  <secondary>
    @type stdout
  </secondary>
</match>

# Route TRACES to Backend API → PostgreSQL
<match traces.**>
  @type http
  @id output_backend_traces
  @log_level info
  
  endpoint http://172.18.0.1:8080/api/traces/ingest
  method post
  content_type application/json
  
  <buffer>
    @type file
    path /fluentd/log/traces_backend.buffer
    flush_interval 30s
    flush_at_shutdown true
    chunk_limit_size 1M
    total_limit_size 100M
  </buffer>
  
  retry_limit 3
  retry_wait 10s
  
  <secondary>
    @type stdout
  </secondary>
</match>

# Default: send any unmatched to OpenSearch
<match **>
  @type opensearch
  @id output_opensearch_default
  @log_level info

  hosts opensearch:9200
  scheme http
  path_prefix /
  suppress_type_name true
  
  index_name default
  logstash_format true
  logstash_prefix default
  logstash_dateformat %Y.%m.%d
  
  <buffer>
    @type file
    path /fluentd/log/default.buffer
    flush_interval 30s
    chunk_limit_size 5M
  </buffer>
</match>

######################################################################
# Usage Instructions:
#
# 1. Start infrastructure:
#    cd infrastructure/docker/configs
#    docker compose up -d
#
# 2. Send data to Fluentd:
#    - Logs:    echo '{"message":"test log","service":"user-service"}' | curl -X POST http://localhost:9880/logs.app -d @-
#    - Metrics: echo '{"cpu":45,"memory":60,"response_time":120}' | curl -X POST http://localhost:9880/metrics.app -d @-
#    - Traces:  echo '{"trace_id":"abc123","duration":50}' | curl -X POST http://localhost:9880/traces.app -d @-
#
# 3. Or use forward protocol:
#    Configure Fluent Bit to forward to fluentd:24224
#
# 4. Verify:
#    - Logs in OpenSearch: curl http://localhost:9200/logs-*/_search
#    - Metrics in PostgreSQL: docker exec postgres psql -U api_monitor -d api_monitoring -c "SELECT * FROM system_metrics LIMIT 5;"
#    - Traces in PostgreSQL: docker exec postgres psql -U api_monitor -d api_monitoring -c "SELECT * FROM distributed_traces LIMIT 5;"
######################################################################
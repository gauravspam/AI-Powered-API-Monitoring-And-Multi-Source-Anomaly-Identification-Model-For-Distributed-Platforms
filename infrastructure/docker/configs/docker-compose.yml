services:
    postgres:
        image: postgres:16
        container_name: postgres
        environment:
            POSTGRES_DB: api_monitoring
            POSTGRES_USER: api_monitor
            POSTGRES_PASSWORD: api_monitor_pwd
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - monitoring-net
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U api_monitor -d api_monitoring"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    opensearch:
        image: opensearchproject/opensearch:2.17.0
        container_name: opensearch
        environment:
            - cluster.name=docker-cluster
            - node.name=opensearch-node1
            - discovery.seed_hosts=opensearch
            - cluster.initial_master_nodes=opensearch-node1
            - bootstrap.memory_lock=true
            - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
            - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Admin123!
            - DISABLE_SECURITY_PLUGIN=true
        ulimits:
            memlock:
                soft: -1
                hard: -1
        volumes:
            - opensearch_data:/usr/share/opensearch/data
        ports:
            - "9200:9200"
            - "9600:9600"
        networks:
            - monitoring-net
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -s http://localhost:9200 >/dev/null || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    fluentd:
        build:
            context: ./fluentd
            dockerfile: Dockerfile
        container_name: fluentd
        ports:
            - "24224:24224" # Forward protocol (TCP)
            - "24224:24224/udp" # Forward protocol (UDP)
            - "9880:9880" # HTTP input
            - "24231:24231" # Prometheus metrics
            - "8888:8888" # Health check
        volumes:
            - ./fluent.conf:/fluentd/etc/fluent.conf:ro
            - fluentd_buffer:/fluentd/log
        environment:
            - FLUENTD_CONF=fluent.conf
            # OpenSearch connection details available in config
            - OPENSEARCH_HOST=opensearch
            - OPENSEARCH_PORT=9200
        networks:
            - monitoring-net
        depends_on:
            opensearch:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--spider",
                    "-q",
                    "http://127.0.0.1:8888/api/plugins.json",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: unless-stopped


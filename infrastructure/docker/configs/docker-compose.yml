services:
    postgres:
        image: postgres:16
        container_name: postgres
        environment:
            POSTGRES_DB: api_monitoring
            POSTGRES_USER: api_monitor
            POSTGRES_PASSWORD: api_monitor_pwd
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - monitoring-net
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U api_monitor -d api_monitoring"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    opensearch:
        image: opensearchproject/opensearch:2.17.0
        container_name: opensearch
        environment:
            - cluster.name=docker-cluster
            - node.name=opensearch-node1
            - discovery.seed_hosts=opensearch
            - cluster.initial_master_nodes=opensearch-node1
            - bootstrap.memory_lock=true
            - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
            - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Admin123!
            - DISABLE_SECURITY_PLUGIN=true
        ulimits:
            memlock:
                soft: -1
                hard: -1
        volumes:
            - opensearch_data:/usr/share/opensearch/data
        ports:
            - "9200:9200"
            - "9600:9600"
        networks:
            - monitoring-net
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -s http://localhost:9200 >/dev/null || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    fluentd:
        build:
            context: ../dockerfiles
            dockerfile: fluentd.Dockerfile
        container_name: fluentd
        ports:
            - "24224:24224"
            - "24224:24224/udp"
            - "9880:9880"
            - "24231:24231"
            - "8888:8888"
        volumes:
            - ./fluent.conf:/fluentd/etc/fluent.conf:ro
            - fluentd_buffer:/fluentd/log
        environment:
            - FLUENTD_CONF=fluent.conf
            - OPENSEARCH_HOST=opensearch
            - OPENSEARCH_PORT=9200
        networks:
            - monitoring-net
        restart: unless-stopped

    vault:
        image: hashicorp/vault:1.15
        container_name: vault
        environment:
            - VAULT_ADDR=http://0.0.0.0:8200
            - VAULT_API_ADDR=http://vault:8200
            - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
            - VAULT_DEV_ROOT_TOKEN_ID=root_token
            - VAULT_SEAL_TYPE=shamir
        ports:
            - "8200:8200"
        volumes:
            - vault_data:/vault/data
        networks:
            - monitoring-net
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://localhost:8200/v1/sys/health"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        cap_add:
            - IPC_LOCK

    ml-service:
        build:
            context: ../../../ml-service
            dockerfile: Dockerfile
        container_name: ml-service
        environment:
            - ML_SERVICE_PORT=9000
        ports:
            - "9000:9000"
        networks:
            - monitoring-net
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
            interval: 20s
            timeout: 10s
            retries: 20
            start_period: 10m
        restart: unless-stopped

    backend:
        build:
            context: ../../../backend-service
            dockerfile: Dockerfile
        container_name: backend
        environment:
            - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/api_monitoring?timezone=UTC
            - SPRING_DATASOURCE_USERNAME=api_monitor
            - SPRING_DATASOURCE_PASSWORD=api_monitor_pwd
            - SPRING_FLYWAY_ENABLED=false
            - OPENSEARCH_HOST=opensearch
            - OPENSEARCH_PORT=9200
            - FLUENTD_HOST=fluentd
            - FLUENTD_PORT=24224
            - ML_SERVICE_URL=http://ml-service:9000
        ports:
            - "8080:8080"
        depends_on:
            postgres:
                condition: service_healthy
            opensearch:
                condition: service_healthy
            ml-service:
                condition: service_started
        networks:
            - monitoring-net
        restart: unless-stopped

    frontend:
        build:
            context: ../../../frontend
            dockerfile: Dockerfile
        container_name: frontend
        environment:
            - VITE_API_BASE_URL=http://localhost:8080/api
            - VITE_BACKEND_URL=http://localhost:8080
            - VITE_ML_SERVICE_URL=http://localhost:9000
        ports:
            - "5173:80"
        depends_on:
            backend:
                condition: service_started
            ml-service:
                condition: service_started
        networks:
            - monitoring-net
        restart: unless-stopped

networks:
    monitoring-net:

volumes:
    postgres_data:
    opensearch_data:
    fluentd_buffer:
    vault_data:
    ml_models:
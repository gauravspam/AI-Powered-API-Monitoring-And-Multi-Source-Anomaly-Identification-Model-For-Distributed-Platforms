# Fluent Bit Configuration for Legacy Application Support
# This config collects logs from files written by legacy applications

[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# ===========================================
# INPUT: Tail log files
# ===========================================

[INPUT]
    Name              tail
    Path              /var/log/legacy/*.log
    Parser            json
    Tag               legacy.app
    DB                /var/log/flb/legacy_app.db
    Refresh_Interval   5

# ===========================================
# INPUT: Parse JSON logs from Log4j2
# ===========================================

[INPUT]
    Name              tail
    Path              /var/log/app.log
    Parser            log4j2
    Tag               log4j.app
    DB                /var/log/flb/log4j_app.db
    Refresh_Interval   5

# ===========================================
# FILTER: Add metadata
# ===========================================

[FILTER]
    Name                record_modifier
    Match              legacy.*
    Record             hostname ${HOSTNAME}
    Record             collector fluent-bit

[FILTER]
    Name                record_modifier
    Match              log4j.*
    Record             hostname ${HOSTNAME}
    Record             collector fluent-bit
    Record             log_format log4j2

# ===========================================
# OUTPUT: Forward to Fluentd
# ===========================================

[OUTPUT]
    Name                forward
    Match               *
    Host                fluentd
    Port                24224
    Retry_Limit         False

# ===========================================
# OUTPUT: Also send to stdout for debugging
# ===========================================

[OUTPUT]
    Name                stdout
    Match               *
    Format             json
    JSON_Format        json
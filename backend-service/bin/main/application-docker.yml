spring:
    application:
        name: api-monitoring-backend
    datasource:
        url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:api_monitoring}
        username: ${POSTGRES_USER:api_monitor}
        password: ${POSTGRES_PASSWORD:monitor123}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: false
    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true

server:
    port: 8080

opensearch:
    enabled: true
    host: ${OPENSEARCH_HOST:opensearch}
    port: ${OPENSEARCH_PORT:9200}
    scheme: ${OPENSEARCH_SCHEME:http}
    username: ${OPENSEARCH_USERNAME:admin}
    password: ${OPENSEARCH_PASSWORD:admin}

python:
    service:
        url: http://ml-models:8000

logging:
    pattern:
        level: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

fluentd:
    host: fluentd
    port: 9880
    path: /api-logs.${spring.application.name}

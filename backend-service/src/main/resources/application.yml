spring:
    application:
        name: api-monitoring-backend
        version: 1.0.0

    datasource:
        url: jdbc:postgresql://postgres:5432/api_monitoring
        username: api_monitor
        password: api_monitor_pwd
        driver-class-name: org.postgresql.Driver
        hikari:
            maximum-pool-size: 10
            minimum-idle: 5
            connection-timeout: 30000
            idle-timeout: 600000
            max-lifetime: 1800000

    jpa:
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: true
                use_sql_comments: true
                jdbc:
                    batch_size: 20
                    fetch_size: 50
                order_inserts: true
                order_updates: true
        show-sql: false
        open-in-view: false

    flyway:
        enabled: false

    jackson:
        serialization:
            write-dates-as-timestamps: false
            indent-output: true
        default-property-inclusion: non_null
        time-zone: UTC

    cache:
        type: simple
        cache-names: mlServiceHealth
        simple:
            time-to-live: 30s

    retry:
        enabled: true

server:
    port: 8080

logging:
    level:
        root: INFO
        com.api.monitoring: DEBUG
        org.springframework.web: INFO
        org.springframework.retry: DEBUG
        com.api.monitoring.backend.service.AnomalyService: DEBUG
        com.api.monitoring.backend.service.MLServiceClient: DEBUG
    pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
        file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file:
        name: logs/backend-service.log
        max-size: 10MB
        max-history: 30

fluentd:
    enabled: false
    host: localhost
    port: 9880

management:
    endpoints:
        web:
            exposure:
                include: health,metrics,info

    endpoint:
        health:
            show-details: always

# OpenSearch Configuration
opensearch:
    host: localhost
    port: 9200
    scheme: http
    username: admin
    password: admin
    enabled: false

# Python ML Service
python:
    service:
        url: ${ML_SERVICE_URL:http://localhost:9000}
        enabled: ${ML_SERVICE_ENABLED:true}
        timeout: 30
        version: 1.0.0
        retry:
            max-attempts: 3
            initial-delay: 1000
            multiplier: 2
            max-delay: 10000

app:
    ml:
        enabled: true
    api:
        anomaly-threshold: 0.7

spring:
    application:
        name: api-monitoring-backend
        version: 1.0.0

    datasource:
        url: jdbc:postgresql://localhost:5433/api_monitoring?timezone=Asia/Kolkata
        username: api_monitor
        password: api_monitor_pwd
        driver-class-name: org.postgresql.Driver
        hikari:
            maximum-pool-size: 10
            minimum-idle: 5
            connection-timeout: 30000
            idle-timeout: 600000
            max-lifetime: 1800000

    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: true
                use_sql_comments: true
                jdbc:
                    batch_size: 20
                    fetch_size: 50
                order_inserts: true
                order_updates: true
        show-sql: false
        open-in-view: false

    flyway:
        enabled: false

    jackson:
        serialization:
            write-dates-as-timestamps: false
            indent-output: true

# gRPC Server Configuration
grpc:
    server:
        port: 9090
        max-message-size: 10MB
        default-property-inclusion: non_null
        time-zone: UTC

    cache:
        type: simple
        cache-names: mlServiceHealth
        simple:
            time-to-live: 30s

    retry:
        enabled: true

server:
    port: 8080

logging:
    level:
        root: INFO
        com.api.monitoring: DEBUG
        org.springframework.web: INFO
        org.springframework.retry: DEBUG
        com.api.monitoring.backend.service.AnomalyService: DEBUG
        com.api.monitoring.backend.service.MLServiceClient: DEBUG
    pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
        file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file:
        name: logs/backend-service.log
        max-size: 10MB
        max-history: 30

fluentd:
    enabled: true
    host: localhost
    port: 24224

management:
    endpoints:
        web:
            exposure:
                include: health,metrics,info

    endpoint:
        health:
            show-details: always

# OpenSearch Configuration
opensearch:
    host: localhost
    port: 9200
    scheme: http
    username: admin
    password: admin
    enabled: true

# Python ML Service
python:
    service:
        url: ${ML_SERVICE_URL:http://localhost:9000}
        enabled: ${ML_SERVICE_ENABLED:true}
        timeout: 30
        version: 1.0.0
        retry:
            max-attempts: 3
            initial-delay: 1000
            multiplier: 2
            max-delay: 10000

app:
    ml:
        enabled: true
        batch:
            enabled: true
    api:
        anomaly-threshold: 0.7

# Alert Configuration
alert:
    teams:
        webhook: ${TEAMS_WEBHOOK_URL:}
    slack:
        webhook: ${SLACK_WEBHOOK_URL:}
    email:
        enabled: ${EMAIL_ALERT_ENABLED:false}
        smtp-host: ${SMTP_HOST:}
        smtp-port: ${SMTP_PORT:587}
        from: ${EMAIL_FROM:}
        to: ${EMAIL_TO:}
    pagerduty:
        enabled: ${PAGERDUTY_ENABLED:false}
        api-key: ${PAGERDUTY_API_KEY:}
        service-id: ${PAGERDUTY_SERVICE_ID:}

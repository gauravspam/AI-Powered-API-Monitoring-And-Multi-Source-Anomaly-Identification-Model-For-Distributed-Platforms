# Configuration is in application.yml
# Database (connects to Docker container mapped to localhost:5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/api_monitoring
spring.datasource.username=api_monitor
spring.datasource.password=api_monitor_pwd

# OpenSearch (connects to Docker container mapped to localhost:9200)
opensearch.enabled=true
opensearch.host=localhost
opensearch.port=9200
opensearch.scheme=http
opensearch.username=admin
opensearch.password=Admin123!

# ML Service (connects to local Python process)
ml-service.url=http://localhost:9000

spring:
    application:
        name: api-monitoring-backend
    datasource:
        url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:api_monitoring}
        username: ${POSTGRES_USER:api_monitor}
        password: ${POSTGRES_PASSWORD:api_monitor_pwd}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: false
    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true

server:
    port: 8080

opensearch:
    enabled: true
    host: localhost
    port: 9200
    scheme: http
    username: admin
    password: admin

python:
    service:
        url: ${ML_SERVICE_URL:http://host.docker.internal:9000}

logging:
    pattern:
        level: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

fluentd:
    enabled: true
    host: localhost
    port: 24224
